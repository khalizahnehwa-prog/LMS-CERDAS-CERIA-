<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cerdas Ceria – LMS</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f9ff;--card:#fff;--tx:#1d2a3a;--mut:#64748b;--pri:#2f7cf6;--pri2:#ffc83d;--ok:#16a34a;--bad:#e11d48;--bd:#dbe6f3}
:root[data-theme="dark"]{--bg:#0f1722;--card:#18232f;--tx:#e8eef6;--mut:#94a3b8;--pri:#5b9cff;--pri2:#f5c542;--ok:#4ade80;--bad:#fb7185;--bd:#2a3a4b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1722;--card:#18232f;--tx:#e8eef6;--mut:#94a3b8;--pri:#5b9cff;--pri2:#f5c542;--ok:#4ade80;--bad:#fb7185;--bd:#2a3a4b}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.logo{font-weight:800;font-size:21px;color:var(--pri)}.logo span{color:var(--pri2)}
.sp{flex:1}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
nav button{white-space:nowrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{font-size:30px;font-weight:800;color:var(--pri)}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 12px;cursor:pointer}
button.on,.b1{background:var(--pri);color:#fff;border-color:var(--pri)}
.b3{color:var(--bad)}
.sm{padding:3px 9px;font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:3px 0 10px}
label{font-size:13px;color:var(--mut)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);vertical-align:top}
.tw{overflow-x:auto}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;background:var(--pri2);color:#3a2c00}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20;overflow:auto}
.ov .card{width:100%;max-width:460px;max-height:92%;overflow:auto;margin:0}
.chk{display:flex;gap:8px;align-items:center;margin:2px 0}.chk input{width:auto;margin:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;display:none;z-index:30}
.hero{text-align:center;padding:24px 0}.hero h1{margin:0;font-size:34px}
pre{white-space:pre-wrap;font:inherit;margin:4px 0}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36)};
const COLS=['users','courses','subs','ann'];
let D={users:[],courses:[],subs:[],ann:[]},me=null,tab='home',cid=null,db=null,owner=false,adminName='Admin',sid=null,A={};
try{sid=localStorage.getItem('cc_me')}catch{}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2500)}
function lsSave(){try{localStorage.setItem('cc_data',JSON.stringify(D))}catch{}}
function save(c,o){const i=D[c].findIndex(x=>x.id==o.id);i<0?D[c].push(o):D[c][i]=o;if(db)db.collection(c).doc(o.id).set(o).catch(()=>toast('Gagal menyimpan: izin ditolak'));else lsSave();render()}
function del(c,id){if(!confirm('Yakin hapus?'))return;D[c]=D[c].filter(x=>x.id!=id);if(db)db.collection(c).doc(id).delete().catch(()=>toast('Gagal menghapus'));else lsSave();render()}
const canAdmin=()=>owner||!db;
const nm=id=>(D.users.find(u=>u.id==id)||{}).name||'-';
const cm=()=>$('#modal').innerHTML='';
function form(title,fs,cb,v={}){
 $('#modal').innerHTML=`<div class="ov"><div class="card"><h3 style="margin-top:0">${title}</h3>${fs.map(f=>{const val=v[f.k]??'';
 if(f.t=='checks')return`<label>${f.l}</label>${f.o.map(o=>`<div class="chk"><input type="checkbox" name="f_${f.k}" value="${o[0]}" ${(v[f.k]||[]).includes(o[0])?'checked':''}>${esc(o[1])}</div>`).join('')||'<div class="mut">Belum ada data</div>'}<br>`;
 const inp=f.t=='textarea'?`<textarea id="f_${f.k}" rows="5">${esc(val)}</textarea>`:f.t=='select'?`<select id="f_${f.k}">${f.o.map(o=>`<option value="${o[0]}" ${o[0]==val?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${f.t=='password'?'':esc(val)}">`;
 return`<label>${f.l}${f.r?' *':''}</label>${inp}`}).join('')}<div class="row"><button onclick="cm()">Batal</button><button class="b1" id="ok">Simpan</button></div></div></div>`;
 $('#ok').onclick=()=>{const o={};for(const f of fs)o[f.k]=f.t=='checks'?[...document.querySelectorAll(`[name=f_${f.k}]:checked`)].map(x=>x.value):$('#f_'+f.k).value.trim();
 if(fs.some(f=>f.r&&!o[f.k]))return toast('Lengkapi isian bertanda *');cm();cb(o)}}
const mine=()=>me.role=='admin'?D.courses:me.role=='guru'?D.courses.filter(c=>c.tid==me.id):D.courses.filter(c=>(c.sts||[]).includes(me.id));
const staff=c=>me.role=='admin'||c.tid==me.id;
const today=()=>new Date().toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});

// ---------- views ----------
function loginView(){return`<div class="hero"><div style="font-size:54px">🌈</div><h1 class="logo">Cerdas <span>Ceria</span></h1><p class="mut">Belajar jadi menyenangkan</p></div>
<div class="card" style="max-width:380px;margin:auto"><h3 style="margin-top:0">Masuk</h3><label>Username</label><input id="lu" autocomplete="username"><label>Kata sandi</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')A.login()">
<button class="b1" style="width:100%" onclick="A.login()">Masuk (Guru / Murid)</button>
${canAdmin()?`<button style="width:100%;margin-top:8px" onclick="A.adm()">🔑 Masuk sebagai Admin</button>`:''}
<p class="mut">${db?'Belum punya akun? Minta admin membuatkan akun untuk Anda.':'Mode lokal: data tersimpan di perangkat ini saja.'}</p></div>`}
function home(){const s=r=>D.users.filter(u=>u.role==r).length;
 return`<div class="grid"><div class="card"><div class="stat">${s('guru')}</div>Guru</div><div class="card"><div class="stat">${s('murid')}</div>Murid</div><div class="card"><div class="stat">${D.courses.length}</div>Kelas</div><div class="card"><div class="stat">${D.subs.length}</div>Pengumpulan tugas</div></div>
 <div class="card"><h3 style="margin-top:0">Selamat datang, ${esc(me.name)} 👋</h3><p>Sebagai admin Anda dapat mengelola semua pengguna, kelas, materi, tugas, nilai, dan pengumuman.</p><button class="b1" onclick="tab='users';render()">Kelola pengguna</button> <button onclick="tab='courses';render()">Kelola kelas</button></div>
 ${annList(3)}`}
function users(){return`<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">Pengguna</h3><button class="b1" onclick="A.eu()">+ Tambah</button></div>
<div class="tw"><table><tr><th>Nama</th><th>Username</th><th>Peran</th><th></th></tr>${D.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.un)}</td><td><span class="tag">${u.role}</span></td><td class="row"><button class="sm" onclick="A.eu('${u.id}')">Ubah</button><button class="sm b3" onclick="del('users','${u.id}')">Hapus</button></td></tr>`).join('')||'<tr><td colspan="4" class="mut">Belum ada pengguna. Tambahkan guru dan murid.</td></tr>'}</table></div></div>`}
function courses(){const l=mine();return`<div class="card row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">${me.role=='murid'?'Kelas Saya':me.role=='guru'?'Kelas yang saya ajar':'Semua Kelas'}</h3>${me.role=='admin'?'<button class="b1" onclick="A.ec()">+ Kelas baru</button>':''}</div>
<div class="grid">${l.map(c=>`<div class="card"><h3 style="margin:0 0 4px">📘 ${esc(c.name)}</h3><div class="mut">Guru: ${esc(nm(c.tid))} · ${(c.sts||[]).length} murid<br>${(c.mats||[]).length} materi · ${(c.asg||[]).length} tugas</div><div class="row" style="margin-top:10px;justify-content:flex-start"><button class="b1 sm" onclick="cid='${c.id}';render()">Buka</button>${me.role=='admin'?`<button class="sm" onclick="A.ec('${c.id}')">Ubah</button><button class="sm b3" onclick="del('courses','${c.id}')">Hapus</button>`:''}</div></div>`).join('')||'<div class="card mut">Belum ada kelas.</div>'}</div>`}
function course(){const c=D.courses.find(x=>x.id==cid);if(!c){cid=null;return courses()}const st=staff(c);
 return`<button onclick="cid=null;render()">← Kembali</button><div class="card" style="margin-top:10px"><h2 style="margin:0">📘 ${esc(c.name)}</h2><div class="mut">Guru: ${esc(nm(c.tid))}${c.desc?' · '+esc(c.desc):''}</div></div>
<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">Materi</h3>${st?`<button class="b1 sm" onclick="A.em('${c.id}')">+ Materi</button>`:''}</div>
${(c.mats||[]).map(m=>`<div style="border-top:1px solid var(--bd);padding:8px 0"><b>${esc(m.t)}</b> <span class="mut">${m.d||''}</span>${st?` <button class="sm b3" onclick="A.dm('${c.id}','${m.id}')">Hapus</button>`:''}<pre>${esc(m.b)}</pre>${m.l?`<a href="${esc(m.l)}" target="_blank" rel="noopener">🔗 Buka tautan</a>`:''}</div>`).join('')||'<p class="mut">Belum ada materi.</p>'}</div>
<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">Tugas</h3>${st?`<button class="b1 sm" onclick="A.ea('${c.id}')">+ Tugas</button>`:''}</div>
${(c.asg||[]).map(a=>{const ss=D.subs.filter(s=>s.aid==a.id);const my=ss.find(s=>s.sid==me.id);
 return`<div style="border-top:1px solid var(--bd);padding:8px 0"><b>${esc(a.t)}</b> <span class="mut">Tenggat: ${esc(a.due||'-')}</span>${st?` <button class="sm b3" onclick="A.da('${c.id}','${a.id}')">Hapus</button>`:''}<pre>${esc(a.desc)}</pre>
 ${st?`<div class="tw"><table>${(c.sts||[]).map(id=>{const s=ss.find(x=>x.sid==id);return`<tr><td>${esc(nm(id))}</td><td>${s?esc(s.text).slice(0,80):'<span class="mut">Belum mengumpulkan</span>'}</td><td>${s?(s.grade!=null&&s.grade!==''?`<b>${esc(s.grade)}</b>`:'-'):''}</td><td>${s?`<button class="sm" onclick="A.gr('${s.id}')">Nilai</button>`:''}</td></tr>`}).join('')||'<tr><td class="mut">Belum ada murid terdaftar</td></tr>'}</table></div>`
 :`${my?`<div class="mut">Terkumpul ✔ · Nilai: <b>${my.grade!=null&&my.grade!==''?esc(my.grade):'belum dinilai'}</b>${my.fb?' · Catatan: '+esc(my.fb):''}</div>`:''}<button class="b1 sm" onclick="A.sb('${c.id}','${a.id}')">${my?'Kumpulkan ulang':'Kumpulkan'}</button>`}</div>`}).join('')||'<p class="mut">Belum ada tugas.</p>'}</div>`}
function grades(){const r=D.subs.filter(s=>s.sid==me.id);return`<div class="card"><h3 style="margin-top:0">Nilai Saya</h3><div class="tw"><table><tr><th>Kelas</th><th>Tugas</th><th>Nilai</th><th>Catatan</th></tr>${r.map(s=>{const c=D.courses.find(x=>x.id==s.cid)||{},a=(c.asg||[]).find(x=>x.id==s.aid)||{};return`<tr><td>${esc(c.name)}</td><td>${esc(a.t)}</td><td><b>${s.grade!=null&&s.grade!==''?esc(s.grade):'-'}</b></td><td>${esc(s.fb||'')}</td></tr>`}).join('')||'<tr><td colspan="4" class="mut">Belum ada tugas yang dikumpulkan.</td></tr>'}</table></div></div>`}
function annList(n){const l=[...D.ann].sort((a,b)=>b.ts-a.ts).slice(0,n||99);return`<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">📣 Pengumuman</h3>${me.role!='murid'?'<button class="b1 sm" onclick="A.ep()">+ Baru</button>':''}</div>${l.map(a=>`<div style="border-top:1px solid var(--bd);padding:8px 0"><b>${esc(a.t)}</b> <span class="mut">${esc(a.d)} · ${esc(a.by)}</span>${me.role=='admin'||a.uid==me.id?` <button class="sm b3" onclick="del('ann','${a.id}')">Hapus</button>`:''}<pre>${esc(a.b)}</pre></div>`).join('')||'<p class="mut">Belum ada pengumuman.</p>'}</div>`}

function render(){
 if(!me&&sid)me=sid=='admin'?(canAdmin()?{id:'admin',name:adminName,role:'admin'}:null):D.users.find(u=>u.id==sid)||null;
 else if(me&&me.id!='admin'){me=D.users.find(u=>u.id==me.id)||null}
 if(!me){$('#app').innerHTML=loginView();return}
 const T=me.role=='admin'?[['home','Ringkasan'],['users','Pengguna'],['courses','Kelas'],['ann','Pengumuman']]:me.role=='guru'?[['courses','Kelas Saya'],['ann','Pengumuman']]:[['courses','Kelas Saya'],['grades','Nilai'],['ann','Pengumuman']];
 if(!T.some(t=>t[0]==tab))tab=T[0][0];
 const body=cid&&tab=='courses'?course():tab=='home'?home():tab=='users'?users():tab=='courses'?courses():tab=='grades'?grades():annList();
 $('#app').innerHTML=`<header><div class="logo">🌈 Cerdas <span>Ceria</span></div><div class="sp"></div><span class="mut">${esc(me.name)} <span class="tag">${me.role}</span></span><button class="sm" onclick="A.out()">Keluar</button></header><nav>${T.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';cid=null;render()">${t[1]}</button>`).join('')}</nav>${body}`}

// ---------- actions ----------
A.login=()=>{const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value;const x=D.users.find(x=>x.un==u&&x.pw==hash(p));if(!x)return toast('Username atau kata sandi salah');setMe(x)};
A.adm=()=>setMe({id:'admin',name:adminName,role:'admin'});
function setMe(u){me=u;sid=u.id;tab='home';cid=null;try{localStorage.setItem('cc_me',sid)}catch{}render()}
A.out=()=>{me=null;sid=null;try{localStorage.removeItem('cc_me')}catch{}render()};
A.eu=id=>{const u=D.users.find(x=>x.id==id)||{};form(id?'Ubah pengguna':'Tambah pengguna',[{k:'name',l:'Nama lengkap',r:1},{k:'un',l:'Username',r:1},{k:'pw',l:id?'Kata sandi baru (kosongkan jika tetap)':'Kata sandi',t:'password',r:!id},{k:'role',l:'Peran',t:'select',o:[['murid','Murid'],['guru','Guru']]}],o=>{o.un=o.un.toLowerCase();if(D.users.some(x=>x.un==o.un&&x.id!=id))return toast('Username sudah dipakai');save('users',{id:id||uid(),name:o.name,un:o.un,role:o.role,pw:o.pw?hash(o.pw):u.pw})},u)};
A.ec=id=>{const c=D.courses.find(x=>x.id==id)||{};form(id?'Ubah kelas':'Kelas baru',[{k:'name',l:'Nama kelas',r:1},{k:'desc',l:'Deskripsi'},{k:'tid',l:'Guru pengajar',t:'select',o:[['','— pilih guru —'],...D.users.filter(u=>u.role=='guru').map(u=>[u.id,u.name])]},{k:'sts',l:'Murid terdaftar',t:'checks',o:D.users.filter(u=>u.role=='murid').map(u=>[u.id,u.name])}],o=>save('courses',{mats:[],asg:[],...c,id:id||uid(),name:o.name,desc:o.desc,tid:o.tid,sts:o.sts}),c)};
const upd=(cid,f)=>{const c=D.courses.find(x=>x.id==cid);f(c);save('courses',c)};
A.em=c=>form('Tambah materi',[{k:'t',l:'Judul',r:1},{k:'b',l:'Isi materi',t:'textarea'},{k:'l',l:'Tautan (opsional)'}],o=>upd(c,k=>(k.mats=k.mats||[]).push({id:uid(),t:o.t,b:o.b,l:/^https?:\/\//.test(o.l)?o.l:'',d:today()})));
A.dm=(c,m)=>confirm('Hapus materi?')&&upd(c,k=>k.mats=k.mats.filter(x=>x.id!=m));
A.ea=c=>form('Tambah tugas',[{k:'t',l:'Judul tugas',r:1},{k:'desc',l:'Instruksi',t:'textarea'},{k:'due',l:'Tenggat',t:'date'}],o=>upd(c,k=>(k.asg=k.asg||[]).push({id:uid(),t:o.t,desc:o.desc,due:o.due})));
A.da=(c,a)=>{if(!confirm('Hapus tugas?'))return;upd(c,k=>k.asg=k.asg.filter(x=>x.id!=a));D.subs.filter(s=>s.aid==a).forEach(s=>{D.subs=D.subs.filter(x=>x.id!=s.id);db&&db.collection('subs').doc(s.id).delete()})};
A.sb=(c,a)=>{const old=D.subs.find(s=>s.aid==a&&s.sid==me.id);form('Kumpulkan tugas',[{k:'text',l:'Jawaban / tautan pekerjaan',t:'textarea',r:1}],o=>save('subs',{...(old||{}),id:old?old.id:uid(),aid:a,cid:c,sid:me.id,text:o.text,grade:old?old.grade:'',fb:old?old.fb:''}),old||{})};
A.gr=id=>{const s=D.subs.find(x=>x.id==id);form('Beri nilai – '+esc(nm(s.sid)),[{k:'grade',l:'Nilai (0–100)',t:'number'},{k:'fb',l:'Catatan'}],o=>save('subs',{...s,grade:o.grade,fb:o.fb}),s)};
A.ep=()=>form('Pengumuman baru',[{k:'t',l:'Judul',r:1},{k:'b',l:'Isi',t:'textarea'}],o=>save('ann',{id:uid(),t:o.t,b:o.b,d:today(),ts:Date.now(),by:me.name,uid:me.id}));

// ---------- init ----------
(async()=>{
 try{
  if(window.claude&&claude.use){
   const u=await claude.use('user');if(u){owner=await u.isOwner();try{adminName=(await u.me()).name||'Admin'}catch{}}
   db=await claude.use('db');
  }
 }catch{db=null}
 if(db){COLS.forEach(c=>db.collection(c).onSnapshot(s=>{D[c]=s.docs.map(d=>d.data());render()},()=>{}))}
 else{try{const x=JSON.parse(localStorage.getItem('cc_data'));if(x)D={...D,...x}}catch{}}
 render();
})();
render();
</script>
</body>
</html>
